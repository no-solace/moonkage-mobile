name: moonkage_verify
description: "Moonkage Verify – xác minh tài khoản bằng thẻ NFC."
publish_to: 'none'

# build-name -> versionName, build-number -> versionCode (Android).
# app_version gửi lên máy chủ được đọc từ đây qua package_info_plus.
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  # NFC: đọc NDEF Text record "MK1|..."
  nfc_manager: ^4.2.1
  nfc_manager_ndef: ^1.1.0

  # Quét QR "moonkage-verify:v1:<session_id>"
  mobile_scanner: ^7.4.2

  # HTTP tới API gateway (URL lấy từ --dart-define, không đọc từ QR)
  dio: ^5.11.1

  # State và điều hướng
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.0

  # Lấy app_version cho body gửi kết quả
  package_info_plus: ^10.2.2
  jose: ^0.3.5+2

  # Lưu trữ phiên an toàn (Remember Me)
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
